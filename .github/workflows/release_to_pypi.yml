name: Publish to PyPI

# The package version always equals the IGVF Catalog version it was released for.
# Publishing uses PyPI trusted publishing (environment "pypi"), so no API token is stored here.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-to-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/igvf-catalog-mcp/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # PyPI rejects packages whose dependencies are direct (git) references.
      - name: Check the async client is pinned
        run: |
          if grep -q '"igvf-catalog-async-client @' pyproject.toml; then
            echo "::error::pyproject.toml still depends on the async client from git; pin igvf-catalog-async-client==X.Y.Z first"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
