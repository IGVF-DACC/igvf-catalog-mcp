name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      # dev tracks the in-progress catalog API, so test against the client generated from igvf-catalog@dev
      # instead of the released client pinned in pyproject.toml.
      - name: Install development async client
        if: github.ref_name == 'dev' || github.base_ref == 'dev'
        run: pip install --force-reinstall "igvf-catalog-async-client @ git+https://github.com/IGVF-DACC/igvf-catalog-async-python-client@dev"
      - name: Lint
        run: ruff check
      - name: Test
        run: pytest
