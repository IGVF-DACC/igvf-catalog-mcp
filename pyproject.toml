[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igvf-catalog-mcp"
dynamic = ["version"]
description = "MCP server for IGVF Catalog genomics knowledge graph"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IGVF DACC"}
]
dependencies = [
    "mcp>=1.0.0,<2",
    "igvf-catalog-async-client==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
igvf-catalog-mcp = "igvf_catalog_mcp.server:run"

[project.urls]
Homepage = "https://github.com/IGVF-DACC/igvf-catalog-mcp"
Repository = "https://github.com/IGVF-DACC/igvf-catalog-mcp"

[tool.hatch.version]
path = "src/igvf_catalog_mcp/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/igvf_catalog_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
